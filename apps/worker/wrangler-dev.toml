name = "flaremail-dev"
main = "src/index.js"
compatibility_date = "2025-06-04"
compatibility_flags = ["nodejs_compat"]
keep_vars = true

[observability]
enabled = true

[dev]
ip = "127.0.0.1"
port = 8787

[[d1_databases]]
binding = "db"
database_name = "mail-db"
database_id = "<d1-database-id>"

[[kv_namespaces]]
binding = "kv"
id = "<kv-namespace-id>"

[[ratelimits]]
name = "LOGIN_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 15, period = 60 }

[[ratelimits]]
name = "SETUP_RATE_LIMITER"
namespace_id = "1003"
simple = { limit = 3, period = 60 }

[[ratelimits]]
name = "SETUP_STATUS_RATE_LIMITER"
namespace_id = "1009"
simple = { limit = 300, period = 60 }

[[ratelimits]]
name = "EMAIL_RATE_LIMITER"
namespace_id = "1004"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "SEND_RATE_LIMITER"
namespace_id = "1005"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "OAUTH_START_RATE_LIMITER"
namespace_id = "1006"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "OAUTH_CALLBACK_RATE_LIMITER"
namespace_id = "1007"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "OAUTH_BIND_RATE_LIMITER"
namespace_id = "1008"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "OAUTH_AUTHORIZE_RATE_LIMITER"
namespace_id = "1010"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "OAUTH_TOKEN_RATE_LIMITER"
namespace_id = "1011"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "OAUTH_USERINFO_RATE_LIMITER"
namespace_id = "1012"
simple = { limit = 120, period = 60 }

#[[r2_buckets]]
#binding = "r2"
#bucket_name = "email"

#[ai]
#binding = "ai"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

#[[send_email]]
#name = "email"


[vars]
# Local-only installation credential. Never deploy this configuration.
# Enter domains and your administrator credentials in the Web installer.
SETUP_SECRET = "local-development-setup-secret-change-me"
ORM_LOG = false

[build]
# Dependencies are installed once from the workspace root.
command = "pnpm --dir ../.. build"
